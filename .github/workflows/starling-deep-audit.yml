name: RustChunk deep Minecraft 1.20.1 source audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustchunk-minecraft-1201-deep-audit
  cancel-in-progress: false

jobs:
  full-version-comparison-and-private-decompilation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout RustChunk with pinned Starling source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply RustChunk's pinned Starling test patch series
        run: python tools/apply_starling_patches.py

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17 for Minecraft 1.20.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Java 25 for Starling 26.3 comparison
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Restore verified inputs and source-analysis tools
        uses: actions/cache@v4
        with:
          path: |
            .local/minecraft/1.20.1-remap
            .local/minecraft/1.20.1-decompile
            .local/minecraft/version-compare
          key: rustchunk-minecraft-1.20.1-deep-${{ hashFiles('tools/minecraft_1_20_1_lock.json') }}
          restore-keys: |
            rustchunk-minecraft-1.20.1-deep-

      - name: Prepare and verify official Minecraft 1.20.1 inputs
        run: python tools/prepare_minecraft_1_20_1.py --java "$JAVA_HOME_17_X64/bin/java"

      - name: Compare 1.20.1 with pinned Starling 26.3
        run: |
          python tools/compare_starling_baseline.py \
            --java-25 "$JAVA_HOME_25_X64/bin/java" \
            --starling-root upstream/starling \
            --target-work-dir .local/minecraft/1.20.1-remap

      - name: Decompile verified client and server privately
        run: |
          python tools/decompile_minecraft_1_20_1.py \
            --java "$JAVA_HOME_17_X64/bin/java" \
            --starling-root upstream/starling \
            --prepared-dir .local/minecraft/1.20.1-remap \
            --work-dir .local/minecraft/1.20.1-decompile \
            --side both --threads 4 --heap 4G

      - name: Upload metadata-only source audit reports
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-deep-source-audit
          path: |
            .local/minecraft/1.20.1-remap/audit-report.json
            .local/minecraft/version-compare/comparison-report.json
            .local/minecraft/1.20.1-decompile/decompile-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
