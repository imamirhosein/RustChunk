name: Starling port-tool tests

on:
  push:
    branches:
      - starling-1.20.1-port-audit
    paths:
      - "tools/mojang_proguard_to_srg.py"
      - "tools/__init__.py"
      - "tests/test_mojang_proguard_to_srg.py"
      - "tests/__init__.py"
      - ".github/workflows/starling-port-tools.yml"
  pull_request:
    paths:
      - "tools/mojang_proguard_to_srg.py"
      - "tools/__init__.py"
      - "tests/test_mojang_proguard_to_srg.py"
      - "tests/__init__.py"
      - ".github/workflows/starling-port-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mapping-tool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run mapping conversion unit tests
        run: python -m unittest tests.test_mojang_proguard_to_srg -v
