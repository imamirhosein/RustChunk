name: RustChunk 1.20.1 port preparation

on:
  push:
    branches:
      - starling-1.20.1-port-audit
    paths:
      - "tools/prepare_minecraft_1_20_1.py"
      - "tools/apply_starling_patches.py"
      - "patches/starling/**"
      - "tools/minecraft_1_20_1_lock.json"
      - "tools/export_minecraft_1_20_1_block_facts.py"
      - "tools/java/Vanilla1201BlockFactsExporter.java"
      - "tools/export_minecraft_1_20_1_heightmap_facts.py"
      - "tools/java/Vanilla1201HeightmapFactsExporter.java"
      - "tools/export_minecraft_1_20_1_block_tags.py"
      - "tools/export_minecraft_1_20_1_fluid_tags.py"
      - "tests/**"
      - ".github/workflows/starling-port-tools.yml"
  pull_request:
    paths:
      - "tools/prepare_minecraft_1_20_1.py"
      - "tools/apply_starling_patches.py"
      - "patches/starling/**"
      - "tools/minecraft_1_20_1_lock.json"
      - "tools/export_minecraft_1_20_1_block_facts.py"
      - "tools/java/Vanilla1201BlockFactsExporter.java"
      - "tools/export_minecraft_1_20_1_heightmap_facts.py"
      - "tools/java/Vanilla1201HeightmapFactsExporter.java"
      - "tools/export_minecraft_1_20_1_block_tags.py"
      - "tools/export_minecraft_1_20_1_fluid_tags.py"
      - "tests/**"
      - ".github/workflows/starling-port-tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run all RustChunk preparation-tool tests
        run: python -m unittest discover -s tests -v

  official-inputs-and-rust-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply RustChunk's pinned Starling test patch series
        run: python tools/apply_starling_patches.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Java 17 for Minecraft 1.20.1
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Restore verified 1.20.1 inputs and official libraries
        uses: actions/cache@v4
        with:
          path: |
            .local/minecraft/1.20.1-remap
            .local/minecraft/1.20.1-export/libraries
          key: rustchunk-minecraft-1.20.1-${{ hashFiles('tools/minecraft_1_20_1_lock.json') }}
      - name: Download, verify, remap and index Minecraft 1.20.1
        run: python tools/prepare_minecraft_1_20_1.py --java "$JAVA_HOME_17_X64/bin/java"
      - name: Export 1.20.1 block-state registry using the official game classes
        run: |
          python tools/export_minecraft_1_20_1_block_facts.py \
            --java "$JAVA_HOME_17_X64/bin/java" \
            --javac "$JAVA_HOME_17_X64/bin/javac" \
            --prepared-dir .local/minecraft/1.20.1-remap \
            --work-dir .local/minecraft/1.20.1-export

      - name: Export 1.20.1 vanilla block tags from verified client/server JARs
        run: |
          python tools/export_minecraft_1_20_1_block_tags.py \
            --prepared-dir .local/minecraft/1.20.1-remap \
            --work-dir .local/minecraft/1.20.1-export

      - name: Export exact 1.20.1 heightmap predicates for every block state
        run: |
          python tools/export_minecraft_1_20_1_heightmap_facts.py \
            --java "$JAVA_HOME_17_X64/bin/java" \
            --javac "$JAVA_HOME_17_X64/bin/javac" \
            --prepared-dir .local/minecraft/1.20.1-remap \
            --work-dir .local/minecraft/1.20.1-export

      - name: Export 1.20.1 vanilla fluid tags from verified client/server JARs
        run: |
          python tools/export_minecraft_1_20_1_fluid_tags.py \
            --prepared-dir .local/minecraft/1.20.1-remap \
            --work-dir .local/minecraft/1.20.1-export

      - name: Set up Rust for the Starling world-registry compatibility test
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Starling host test build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            upstream/starling -> upstream/starling/target
          shared-key: starling-world-facts-compatibility

      - name: Test the 1.20.1 facts and block tags with Starling's real Rust world code
        env:
          RUSTCHUNK_1201_FACTS_JSON: ${{ github.workspace }}/.local/minecraft/1.20.1-export/block-facts/facts.json
          RUSTCHUNK_1201_BLOCK_TAGS_JSON: ${{ github.workspace }}/.local/minecraft/1.20.1-export/block-tags/block-tags.json
          RUSTCHUNK_1201_FLUID_TAGS_JSON: ${{ github.workspace }}/.local/minecraft/1.20.1-export/fluid-tags/fluid-tags.json
        run: |
          set -euo pipefail
          facts="$RUSTCHUNK_1201_FACTS_JSON"
          tags="$RUSTCHUNK_1201_BLOCK_TAGS_JSON"
          fluids="$RUSTCHUNK_1201_FLUID_TAGS_JSON"
          test -s "$facts"
          test -s "$tags"
          test -s "$fluids"
          mkdir -p upstream/starling/.local/horizon-client/26.3
          cp "$facts" upstream/starling/.local/horizon-client/26.3/facts.json
          cargo test --locked --manifest-path upstream/starling/Cargo.toml \
            -p horizon-world --lib \
            registry::facts::tests::matches_the_tree_built_registry -- --exact --nocapture
          cargo test --locked --manifest-path upstream/starling/Cargo.toml \
            -p horizon-world --test rustchunk_1201_tags -- --nocapture

      - name: Export metadata-only audit reports
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-1.20.1-port-audit
          path: |
            .local/minecraft/1.20.1-remap/audit-report.json
            .local/minecraft/1.20.1-export/block-facts/block-facts-report.json
            .local/minecraft/1.20.1-export/heightmap-facts/heightmap-facts-report.json
            .local/minecraft/1.20.1-export/block-tags/block-tags-report.json
            .local/minecraft/1.20.1-export/fluid-tags/fluid-tags-report.json
          include-hidden-files: true
          if-no-files-found: error
