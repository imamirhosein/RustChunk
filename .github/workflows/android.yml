name: RustChunk Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Build Rust library for Android ARM64
        run: cargo ndk -t arm64-v8a build --release -p rustchunk-engine

      - name: Copy native library into Android app
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/librustchunk.so app/src/main/jniLibs/arm64-v8a/librustchunk.so

      - name: Build debug APK
        run: |
          gradle --version
          gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RustChunk-stage0-arm64-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
